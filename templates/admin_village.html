{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>乡村概况管理</h2>
    <form method="post" action="{{ url_for('admin_village') }}" class="mb-4">
        <div class="mb-3">
            <label for="title" class="form-label">标题</label>
            <input type="text" class="form-control" id="title" name="title" required>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">内容</label>
            <textarea class="form-control" id="content" name="content" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">添加概况</button>
    </form>
    <table class="table table-bordered">
        <thead><tr><th>ID</th><th>标题</th><th>内容</th><th>创建时间</th><th>操作</th></tr></thead>
        <tbody>
        {% for v in village_list %}
        <tr>
            <td>{{ v.id }}</td>
            <td>{{ v.title }}</td>
            <td>{{ v.content }}</td>
            <td>{{ v.create_time }}</td>
            <td>
                <button class="btn btn-sm btn-warning" onclick="editVillage({{ v.id }}, '{{ v.title }}', '{{ v.content }}')">编辑</button>
                <button class="btn btn-sm btn-danger" onclick="deleteVillage({{ v.id }})">删除</button>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
    <!-- 编辑模态框 -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="editForm">
            <div class="modal-header">
              <h5 class="modal-title" id="editModalLabel">编辑乡村概况</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="edit_id" name="id">
              <div class="mb-3">
                <label for="edit_title" class="form-label">标题</label>
                <input type="text" class="form-control" id="edit_title" name="title" required>
              </div>
              <div class="mb-3">
                <label for="edit_content" class="form-label">内容</label>
                <textarea class="form-control" id="edit_content" name="content" rows="4" required></textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
              <button type="submit" class="btn btn-primary">保存修改</button>
            </div>
          </form>
        </div>
      </div>
    </div>
</div>
<script>
function editVillage(id, title, content) {
    document.getElementById('edit_id').value = id;
    document.getElementById('edit_title').value = title;
    document.getElementById('edit_content').value = content;
    var editModal = new bootstrap.Modal(document.getElementById('editModal'));
    editModal.show();
}
document.getElementById('editForm').onsubmit = function(e) {
    e.preventDefault();
    var id = document.getElementById('edit_id').value;
    var title = document.getElementById('edit_title').value;
    var content = document.getElementById('edit_content').value;
    fetch('/admin/village/' + id, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({title: title, content: content})
    }).then(res => res.json()).then(data => {
        if(data.msg && data.msg.includes('成功')) {
            location.reload();
        } else {
            alert(data.msg || '修改失败');
        }
    });
};
function deleteVillage(id) {
    if(confirm('确定要删除该概况吗？')) {
        fetch('/admin/village/' + id, {method: 'DELETE'}).then(res => res.json()).then(data => {
            if(data.msg && data.msg.includes('删除')) {
                location.reload();
            } else {
                alert(data.msg || '删除失败');
            }
        });
    }
}
</script>
{% endblock %}
