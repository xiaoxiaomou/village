<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 乡村信息平台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/apple-style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-title {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .login-subtitle {
            font-size: 17px;
        }
        
        .social-login {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .social-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .social-btn:hover {
            background: #f5f5f7;
            transform: translateY(-1px);
        }
        
        .social-icon {
            width: 20px;
            height: 20px;
            margin-right: 8px;
        }
        
        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 15px;
        }
        
        .forgot-password {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 20px;
        }
        
        .forgot-password a {
            font-size: 15px;
        }
        
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
            
            .login-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <header class="apple-navbar">
        <a href="/" class="apple-logo">乡村信息平台</a>
        <nav>
            <a href="/" class="apple-nav-link">首页</a>
            <a href="/contact" class="apple-nav-link">联系我们</a>
        </nav>
    </header>

    <main class="main-container">
        <div class="apple-card login-container apple-slide-up">
            <div class="login-header">
                <h1 class="apple-page-title login-title">欢迎回来</h1>
                <p class="apple-page-subtitle login-subtitle">登录您的账户以继续</p>
            </div>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="apple-alert apple-alert-info">
                            <span>{{ message }}</span>
                            <button class="alert-close">&times;</button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="post" action="{{ url_for('login') }}">
                <div class="apple-form-group">
                    <label for="username" class="apple-form-label">用户名</label>
                    <input type="text" class="apple-form-control" id="username" name="username" required autocomplete="username">
                </div>

                <div class="apple-form-group">
                    <label for="password" class="apple-form-label">密码</label>
                    <input type="password" class="apple-form-control" id="password" name="password" required autocomplete="current-password">
                </div>

                <div class="forgot-password">
                    <a href="#" onclick="alert('请联系管理员重置密码')">忘记密码？</a>
                </div>

                <button type="submit" class="apple-btn apple-btn-primary">登录</button>
            </form>

            <div class="apple-divider">
                <span>或</span>
            </div>

            <div class="social-login">
                <div class="social-btn" onclick="alert('微信登录暂未开放')">
                    <svg class="social-icon" viewBox="0 0 24 24" fill="#07C160">
                        <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.27-.027-.407-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/>
                    </svg>
                    微信
                </div>
                <div class="social-btn" onclick="alert('QQ登录暂未开放')">
                    <svg class="social-icon" viewBox="0 0 24 24" fill="#12B7F5">
                        <path d="M21.395 15.035a39.39 39.39 0 0 0-.803-2.264l-1.079-2.695-.001-.003c-.024-.06-.048-.12-.074-.178A8.963 8.963 0 0 0 12 4.001a8.964 8.964 0 0 0-7.438 3.894 2.747 2.747 0 0 0-.074.178l-.001.003-1.079 2.695a39.39 39.39 0 0 0-.803 2.264C1.201 17.266 1.433 19.479 3.07 20.5h.001c.812.51 1.898.799 3.064.799 1.575 0 2.892-.492 3.865-1.451l.012-.012.012.012c.973.959 2.29 1.451 3.865 1.451 1.166 0 2.252-.289 3.064-.799h.001c1.637-1.021 1.869-3.234 1.465-5.465zM8.707 18.673c-.629.617-1.478.925-2.572.925-.875 0-1.639-.212-2.203-.569-.534-.338-.942-.822-1.191-1.416-.299-.71-.34-1.539-.122-2.424.218-.885.642-1.879 1.266-2.949A6.952 6.952 0 0 1 12 6.001a6.952 6.952 0 0 1 8.115 6.239c.624 1.07 1.048 2.064 1.266 2.949.218.885.177 1.714-.122 2.424-.249.594-.657 1.078-1.191 1.416-.564.357-1.328.569-2.203.569-1.094 0-1.943-.308-2.572-.925a3.48 3.48 0 0 1-1.293-2.718c0-1.062.523-2.004 1.293-2.718a3.48 3.48 0 0 1 2.572-.925c1.094 0 1.943.308 2.572.925A3.48 3.48 0 0 1 12 15.93a3.48 3.48 0 0 1-1.293-2.718c0-1.062.523-2.004 1.293-2.718z"/>
                    </svg>
                    QQ
                </div>
            </div>

            <div class="register-link">
                还没有账号？<a href="{{ url_for('register') }}">立即注册</a>
            </div>
        </div>
    </main>

    <script>
        // 关闭提示框
        document.querySelectorAll('.alert-close').forEach(button => {
            button.addEventListener('click', function() {
                this.parentElement.style.display = 'none';
            });
        });

        // 表单提交动画
        document.querySelector('form').addEventListener('submit', function() {
            const submitBtn = this.querySelector('.btn-primary');
            submitBtn.textContent = '登录中...';
            submitBtn.disabled = true;
        });

        // 输入框焦点效果
        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'translateY(-2px)';
            });

            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'translateY(0)';
            });
        });
    </script>
</body>
</html>
