<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>注册 - 乡村记忆系统</title>
<link rel="stylesheet" href="/static/font-awesome/css/all.min.css" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

:root {
  --ink-dark: #1a1a2e;
  --ink: #2d2d44;
  --ink-light: #4a4a6a;
  --ink-muted: #7a7a9a;
  --paper: #faf8f3;
  --paper-warm: #f5f0e8;
  --paper-deep: #ebe5d9;
  --cinnabar: #c45c48;
  --cinnabar-light: #d97b6a;
  --cinnabar-pale: #f5e0dc;
  --jade: #5a8a7f;
  --jade-light: #7ab5a8;
  --gold: #b8956a;
  --gold-light: #d4b896;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--paper);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(184,149,106,0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(196,92,72,0.02) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

.auth-header {
  background: rgba(250,248,243,0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--paper-deep);
  position: relative;
  z-index: 10;
}

.auth-header-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 32px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.auth-logo {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--ink-dark);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: 2px;
}

.auth-logo i { color: var(--cinnabar); font-size: 20px; }

.auth-nav a {
  color: var(--ink-light);
  text-decoration: none;
  font-size: 14px;
  margin-left: 24px;
  transition: color 0.3s;
}

.auth-nav a:hover { color: var(--cinnabar); }

.auth-main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  position: relative;
  z-index: 1;
}

.auth-container {
  width: 100%;
  max-width: 460px;
}

.auth-card {
  background: white;
  border-radius: 24px;
  padding: 48px 40px;
  border: 1px solid var(--paper-deep);
  box-shadow: 0 8px 40px rgba(26,26,46,0.08);
  position: relative;
  overflow: hidden;
}

.auth-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--cinnabar), var(--gold));
}

.auth-header-text {
  text-align: center;
  margin-bottom: 32px;
}

.auth-header-text h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--ink-dark);
  margin: 0 0 8px 0;
  letter-spacing: 2px;
}

.auth-header-text p {
  color: var(--ink-muted);
  font-size: 14px;
}

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-light);
  margin-bottom: 8px;
}

.form-group input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid var(--paper-deep);
  border-radius: 12px;
  font-size: 15px;
  font-family: inherit;
  color: var(--ink);
  background: white;
  transition: all 0.3s;
}

.form-group input:focus {
  outline: none;
  border-color: var(--jade);
  box-shadow: 0 0 0 4px rgba(90,138,127,0.1);
}

.form-group input::placeholder {
  color: var(--ink-muted);
}

.password-strength {
  margin-top: 8px;
  height: 4px;
  background: var(--paper-deep);
  border-radius: 2px;
  overflow: hidden;
}

.password-strength-bar {
  height: 100%;
  width: 0;
  transition: width 0.3s ease, background-color 0.3s ease;
}

.strength-weak { width: 33%; background: var(--cinnabar); }
.strength-medium { width: 66%; background: var(--gold); }
.strength-strong { width: 100%; background: var(--jade); }

.btn-submit {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: linear-gradient(135deg, var(--cinnabar) 0%, var(--cinnabar-light) 100%);
  color: white;
  box-shadow: 0 4px 14px rgba(196,92,72,0.3);
  transition: all 0.3s;
  margin-top: 8px;
}

.btn-submit:hover:not(:disabled) {
  box-shadow: 0 6px 20px rgba(196,92,72,0.4);
  transform: translateY(-1px);
}

.btn-submit:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.auth-footer-link {
  text-align: center;
  margin-top: 24px;
  font-size: 14px;
  color: var(--ink-muted);
}

.auth-footer-link a {
  color: var(--cinnabar);
  font-weight: 500;
  text-decoration: none;
}

.flash-msg {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 20px;
  font-size: 13px;
  background: var(--gold-pale);
  color: var(--gold);
  border: 1px solid rgba(184,149,106,0.3);
  position: relative;
  overflow: hidden;
}

.flash-msg::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--gold);
}

.deco-circle {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}

.deco-circle-1 {
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(196,92,72,0.04) 0%, transparent 70%);
  top: -100px;
  right: -100px;
}

.deco-circle-2 {
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(90,138,127,0.03) 0%, transparent 70%);
  bottom: -150px;
  left: -150px;
}

@media (max-width: 480px) {
  .auth-card { padding: 36px 24px; border-radius: 20px; }
  .auth-header-inner { padding: 0 20px; }
}
</style>
</head>
<body>
<div class="deco-circle deco-circle-1"></div>
<div class="deco-circle deco-circle-2"></div>

<header class="auth-header">
  <div class="auth-header-inner">
    <a href="/" class="auth-logo"><i class="fas fa-mountain"></i> 乡村记忆</a>
    <nav class="auth-nav">
      <a href="/">首页</a>
      <a href="/login">登录</a>
    </nav>
  </div>
</header>

<main class="auth-main">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header-text">
        <h1>创建账户</h1>
        <p>注册后将等待管理员审核</p>
      </div>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for message in messages %}
          <div class="flash-msg">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('auth.register') }}" id="registerForm">
        <div class="form-group">
          <label>用户名 *</label>
          <input type="text" id="username" name="username" required minlength="3" placeholder="至少3个字符" />
        </div>
        <div class="form-group">
          <label>邮箱 *</label>
          <input type="email" id="email" name="email" required placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label>手机号</label>
          <input type="tel" id="phone" name="phone" placeholder="选填" />
        </div>
        <div class="form-group">
          <label>昵称</label>
          <input type="text" id="nickname" name="nickname" placeholder="选填，默认为用户名" />
        </div>
        <div class="form-group">
          <label>密码 *</label>
          <input type="password" id="password" name="password" required minlength="6" placeholder="至少6个字符" />
          <div class="password-strength">
            <div class="password-strength-bar" id="passwordStrength"></div>
          </div>
        </div>
        <div class="form-group">
          <label>确认密码 *</label>
          <input type="password" id="confirm_password" name="confirm_password" required placeholder="再次输入密码" />
        </div>
        <button type="submit" class="btn-submit" id="submitBtn" disabled>提交注册申请</button>
      </form>
      <div class="auth-footer-link">已有账号？<a href="/login">立即登录</a></div>
    </div>
  </div>
</main>

<script>
const pw = document.getElementById("password");
const cpw = document.getElementById("confirm_password");
const btn = document.getElementById("submitBtn");
const bar = document.getElementById("passwordStrength");

function checkForm() {
  const uname = document.getElementById("username").value;
  btn.disabled = !(pw.value.length >= 6 && pw.value === cpw.value && uname.length >= 3);
}

pw.addEventListener("input", () => {
  let s = 0;
  if (pw.value.length >= 6) s++;
  if (/[A-Z]/.test(pw.value) && /[a-z]/.test(pw.value)) s++;
  if (/[0-9]/.test(pw.value)) s++;
  bar.className = "password-strength-bar";
  if (s === 1) bar.classList.add("strength-weak");
  else if (s === 2) bar.classList.add("strength-medium");
  else if (s === 3) bar.classList.add("strength-strong");
  checkForm();
});

cpw.addEventListener("input", checkForm);
document.getElementById("username").addEventListener("input", checkForm);
</script>
</body>
</html>
