{% extends 'base.html' %} {% block content %}
<div class="container mt-4">
  <h2>用户管理</h2>
  <form method="post" action="{{ url_for('admin.admin_users') }}" class="mb-4">
    <div class="mb-3">
      <label for="username" class="form-label">用户名</label>
      <input type="text" class="form-control" id="username" name="username" required />
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">密码</label>
      <input type="password" class="form-control" id="password" name="password" required />
    </div>
    <div class="mb-3">
      <label for="role" class="form-label">角色</label>
      <select class="form-control" id="role" name="role">
        <option value="user">普通用户</option>
        <option value="admin">管理员</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">添加用户</button>
  </form>
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>用户名</th>
        <th>角色</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>
      {% for user in users %}
      <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.role }}</td>
        <td>
          <button
            class="btn btn-sm btn-warning"
            onclick="editUser({{ user.id }}, '{{ user.username }}', '{{ user.role }}')"
          >
            编辑
          </button>
          <button class="btn btn-sm btn-danger" onclick="deleteUser({{ user.id }})">删除</button>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  <!-- 编辑模态框 -->
  <div
    class="modal fade"
    id="editModal"
    tabindex="-1"
    aria-labelledby="editModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="editForm">
          <div class="modal-header">
            <h5 class="modal-title" id="editModalLabel">编辑用户</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="edit_id" name="id" />
            <div class="mb-3">
              <label for="edit_username" class="form-label">用户名</label>
              <input type="text" class="form-control" id="edit_username" name="username" required />
            </div>
            <div class="mb-3">
              <label for="edit_role" class="form-label">角色</label>
              <select class="form-control" id="edit_role" name="role">
                <option value="user">普通用户</option>
                <option value="admin">管理员</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="edit_password" class="form-label">新密码（如需修改）</label>
              <input type="password" class="form-control" id="edit_password" name="password" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            <button type="submit" class="btn btn-primary">保存修改</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
  function editUser(id, username, role) {
    document.getElementById("edit_id").value = id;
    document.getElementById("edit_username").value = username;
    document.getElementById("edit_role").value = role;
    document.getElementById("edit_password").value = "";
    var editModal = new bootstrap.Modal(document.getElementById("editModal"));
    editModal.show();
  }
  document.getElementById("editForm").onsubmit = function (e) {
    e.preventDefault();
    var id = document.getElementById("edit_id").value;
    var username = document.getElementById("edit_username").value;
    var role = document.getElementById("edit_role").value;
    var password = document.getElementById("edit_password").value;
    var body = { username: username, role: role };
    if (password) body.password = password;
    fetch("/admin/users/" + id, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    })
      .then((res) => res.json())
      .then((data) => {
        if (data.msg && data.msg.includes("成功")) {
          location.reload();
        } else {
          alert(data.msg || "修改失败");
        }
      });
  };
  function deleteUser(id) {
    if (confirm("确定要删除该用户吗？")) {
      fetch("/admin/users/" + id, { method: "DELETE" })
        .then((res) => res.json())
        .then((data) => {
          if (data.msg && data.msg.includes("删除")) {
            location.reload();
          } else {
            alert(data.msg || "删除失败");
          }
        });
    }
  }
</script>
{% endblock %}
